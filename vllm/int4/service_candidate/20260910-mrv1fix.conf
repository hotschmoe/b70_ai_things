# Candidate only. Do not install before qualification.json passes serve.py check.
[Service]
UnsetEnvironment=B70_PRIOR_VALIDATION
ExecStart=
ExecStart=/usr/bin/python3 /mnt/vm_8tb/github/b70_ai_things/vllm/int4/service_candidate/serve.py start
ExecStop=
ExecStop=/usr/bin/python3 /mnt/vm_8tb/github/b70_ai_things/vllm/int4/service_candidate/serve.py stop
ExecStartPost=
ExecStartPost=/usr/bin/python3 /mnt/vm_8tb/github/b70_ai_things/vllm/int4/service_candidate/serve.py ready --pid ${MAINPID}
TimeoutStartSec=12000
TimeoutStopSec=900
Restart=no
