# Prepared only. Install only after new native5802_service freeze/check succeeds.
[Service]
UnsetEnvironment=B70_PRIOR_VALIDATION
ExecStart=
ExecStart=/usr/bin/python3 /mnt/vm_8tb/github/b70_ai_things/vllm/int4/native5802_service/serve.py start
ExecStop=
ExecStop=/usr/bin/python3 /mnt/vm_8tb/github/b70_ai_things/vllm/int4/native5802_service/serve.py stop
ExecStartPost=
ExecStartPost=/usr/bin/python3 /mnt/vm_8tb/github/b70_ai_things/vllm/int4/native5802_service/serve.py ready --pid ${MAINPID}
TimeoutStartSec=12000
TimeoutStopSec=900
Restart=no
