[project]
name = "b70_qsa_xpu"
version = "0.1.0"
description = "Strata-semantic QSA indexer attention for qwen4_exp on Intel XPU."
requires-python = ">=3.12"

[project.entry-points."vllm.general_plugins"]
b70_qsa_xpu = "b70_qsa_xpu:register"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["b70_qsa_xpu*"]
