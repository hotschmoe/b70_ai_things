# models/manifest.yaml -- registry of every model weight kept live.
# fetch.sh reprovisions downloadable entries into models/files/.
#
# source.type:
#   hf      -> downloadable from Hugging Face
#   custom  -> built on this box; preserve until a rebuild recipe or upload exists
#
# The 2026-08-26 cleanup narrowed the live registry to Qwen3.8-27B,
# NVIDIA Qwen3.6-27B NVFP4, and Ornith-1.5-35B-A3B. The previous registry is
# preserved locally at:
# archive/to-delete-20260826/models/manifest.before-cleanup.yaml

version: 1
root: files

models:
  # Qwen3.6-27B: NVIDIA NVFP4 only.
  - id: qwen3.6-27b/nvfp4-modelopt
    family: qwen3.6-27b
    scheme: nvfp4-modelopt-mixed
    vision: true
    mtp: true
    size_gb: 21
    served_as: qwen3.6-27b-NVFP4-modelopt-fused-graph-mtp5
    source: { type: hf, repo: nvidia/Qwen3.6-27B-NVFP4 }
    notes: ModelOpt MIXED_PRECISION checkpoint. MLP weights are group-16
           NVFP4; attention weights are FP8; vision and MTP are retained.

  # Qwen3.8-27B: BF16 source, preferred NVFP4, and W8A8 research target.
  - id: qwen3.8-27b/bf16
    family: qwen3.8-27b
    scheme: bf16
    vision: true
    mtp: true
    size_gb: 52
    served_as: qwen38-27b
    source: { type: hf, repo: Qwen/Qwen3.8-27B }
    notes: Official BF16 source for validation and local quantization.

  - id: qwen3.8-27b/nvfp4-radixark
    family: qwen3.8-27b
    scheme: nvfp4-radixark-mixed
    vision: true
    mtp: true
    size_gb: 21
    served_as: qwen3.8-27b-NVFP4-radixark
    source:
      type: hf
      repo: RadixArk/Qwen3.8-27B-NVFP4
      revision: 554ebba9b5f1b79dc11246341960360e6ef05ef4
    notes: Preferred Qwen3.8 NVFP4. ModelOpt MIXED_PRECISION with group-16
           NVFP4 MLP/lm_head, FP8 attention/GDN, and BF16 vision/MTP.

  - id: qwen3.8-27b/w8a8-gptq
    family: qwen3.8-27b
    scheme: w8a8-gptq
    vision: true
    mtp: true
    size_gb: 35
    served_as: qwen3.8-27b-W8A8-gptq
    source: { type: custom, origin: quantized-on-device }
    derived_from: Qwen/Qwen3.8-27B
    build: scripts/150 GPTQ W8A8 SMOOTHQUANT=0; vision and MTP grafted from bf16
    notes: compressed-tensors W8A8 research checkpoint.

  - id: qwen3.8-27b/gptq-int4-mtp-bf16-9d189a60
    family: qwen3.8-27b
    scheme: gptq-int4-symmetric-g128
    vision: false
    mtp: true
    size_gb: 19
    served_as: qwen3.8-27b-GPTQ-INT4-g128-mtp-bf16
    source:
      type: hf
      repo: SergiioB/Qwen3.8-27B-GPTQ-Int4-sym-G128-MTP-BF16
      revision: 9d189a60e4c0ad7f9f47cd94bfa393ca10b3924e
    notes: XeCores recipe pin. Text-only GPTQ INT4 target with all 15 MTP
           tensors preserved in BF16; exact five-shard contract verified.

  # Ornith-1.5-35B-A3B: retain the complete local family.
  - id: ornith-1.5-35b-a3b/bf16-mtp-shisa
    family: ornith-1.5-35b-a3b
    scheme: bf16
    vision: true
    mtp: true
    size_gb: 67
    source:
      type: hf
      repo: shisa-ai/Ornith-1.5-35B-A3B-MTP
      revision: 779a91ed5b7597bc6db383d9fffb4343b67892ea
    notes: Official target weights with the code-tuned Shisa BF16 MTP head.

  - id: ornith-1.5-35b-a3b/w8a8-rtn-mtp-shisa
    family: ornith-1.5-35b-a3b
    scheme: quark-w8a8-int8-rtn
    vision: true
    mtp: true
    size_gb: 37
    served_as: ornith-1.5-35b-a3b-W8A8-rtn-mtp-shisa
    source: { type: custom, origin: quantized-on-device }
    derived_from: ornith-1.5-35b-a3b/bf16-mtp-shisa
    notes: Per-output-channel symmetric INT8 RTN with the Shisa MTP sidecar.

  - id: ornith-1.5-35b-a3b/nvfp4-modelopt
    family: ornith-1.5-35b-a3b
    scheme: nvfp4-modelopt-mixed
    vision: true
    mtp: true
    size_gb: 22
    served_as: ornith-1.5-35b-A3B-NVFP4
    source: { type: hf, repo: ornith-ai/Ornith-1.5-35B-A3B-NVFP4 }
    notes: Official mixed ModelOpt NVFP4 checkpoint.

  - id: ornith-1.5-35b-a3b/gptq-int4-mixedcal-v2
    family: ornith-1.5-35b-a3b
    scheme: gptq-int4-mixedcal-v2
    vision: true
    mtp: true
    size_gb: 23
    source: { type: custom, origin: quantized-on-device }
    derived_from: ornith-ai/Ornith-1.5-35B-A3B
    notes: Local GPTQModel 7.3.2 mixed-calibration INT4 checkpoint.
